services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3:8b-instruct
      WHISPER_MODEL: large-v3
    volumes:
      - ./output:/app/output
      - ./temp:/app/temp
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
